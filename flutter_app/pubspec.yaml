name: flutter_app
description: "Nari Mitra — AI-powered women's safety app with on-device aggression detection."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # ── Core inference & audio ──────────────────────────────────────────────────
  tflite_flutter: ^0.12.0
  flutter_sound: ^9.28.0
  fftea: ^1.5.0

  # ── Networking & storage ────────────────────────────────────────────────────
  http: ^1.4.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

  # ── Permissions ─────────────────────────────────────────────────────────────
  permission_handler: ^11.4.0

  # ── Contact picker — native address book integration ────────────────────────
  # AndroidManifest.xml: add READ_CONTACTS permission
  # iOS Info.plist: add NSContactsUsageDescription
  flutter_contacts: ^1.1.9+2

  # ── Haptic feedback for SOS countdown ───────────────────────────────────────
  # AndroidManifest.xml: add VIBRATE permission (usually auto-granted)
  vibration: ^2.0.0

  # ── Evidence Vault: local WAV playback ──────────────────────────────────────
  # Plays evidence_*.wav files stored in the app's documents directory.
  audioplayers: ^6.0.0

  # ── UI ───────────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/aggression_model.tflite
    - assets/example_mfcc.json
    - assets/normal_mfcc.json
    - assets/aggressive_mfcc.json
